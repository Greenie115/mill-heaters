<!doctype html>
<!-- Mill heater controller: static page, talks to Mill's cloud API directly from the browser.
     Host anywhere static (GitHub Pages). No server, no secrets in this file. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12100e">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.millnorwaycloud.com http://127.0.0.1:*">
<title>Heaters</title>
<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#1c1a17;--mute:#7a736a;--line:#e7e1d9;--warm:#e2572b;--warm-soft:#fbe6dc;--cool:#3d6fb6;--cool-soft:#e3ecf8;--bad:#b3261e;--seg:#efeae4}
@media (prefers-color-scheme:dark){:root{--bg:#12100e;--card:#1d1a17;--ink:#f3eee8;--mute:#9b9288;--line:#2c2823;--warm:#ff7a45;--warm-soft:#3a2117;--cool:#8fb4ff;--cool-soft:#1b2536;--bad:#ff8a80;--seg:#26221e}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
h1{font-size:28px;letter-spacing:-.02em;margin:0}h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:26px 4px 10px}
.actions{display:flex;gap:8px}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;transition:transform .08s,background .2s,color .2s}
button:active{transform:scale(.96)}button:disabled{opacity:.4;cursor:default}
.primary{background:var(--warm);border-color:var(--warm);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px;transition:border-color .3s}
.card.heating{border-color:var(--warm)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-weight:650;font-size:19px}.sub{color:var(--mute);font-size:13px}
.now{font-size:38px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.now small{font-size:15px;color:var(--mute)}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--mute)}
.pill.on{background:var(--warm-soft);color:var(--warm);border-color:transparent}
.pill.away{background:var(--cool-soft);color:var(--cool);border-color:transparent}
.pill.offline{color:var(--bad);border-color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--seg);border-radius:12px;padding:3px;margin-top:14px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-size:14px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0/.12)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.preset{border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}
.preset.active{border-color:var(--warm)}
.preset .sub{font-size:12px}.preset b{display:block;font-size:18px;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.step{display:flex;justify-content:center;gap:6px}.step button{width:36px;height:36px;padding:0;border-radius:50%;font-size:18px}
.heaters{margin-top:14px;border-top:1px solid var(--line)}
.heater{padding:10px 0;border-bottom:1px solid var(--line)}.heater:last-child{border-bottom:0;padding-bottom:0}
.heater .hn{font-weight:550}
.switch{min-width:64px;padding:6px 12px}.switch.on{background:var(--warm);border-color:var(--warm);color:#fff}
.set{display:flex;align-items:center;gap:8px}
.set b{min-width:64px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.set button{width:44px;height:44px;padding:0;font-size:22px;border-radius:50%}
.diag{margin-top:8px;font-size:13px;color:var(--bad)}
.house{display:grid;gap:10px}.house.away{border-color:var(--cool)}
.house label{font-size:14px;color:var(--mute)}
.msg{color:var(--mute);text-align:center;padding:40px 0}.err{color:var(--bad);min-height:1.4em}
form{display:grid;gap:10px}form.login{margin-top:24px}
input{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
form.login button{padding:12px}
.fine{font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<header><h1>Heaters</h1><div class="actions"><button id="refresh" hidden>Refresh</button><button id="logout" hidden>Sign out</button></div></header>
<div id="app" class="msg">Loading…</div></main>
<div class="toast" id="toast" role="status"></div>

<template id="t-login"><form class="login">
 <label for="e">Mill account email</label><input id="e" type="email" autocomplete="username" required>
 <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
 <div class="err"></div><button class="primary">Sign in</button>
 <p class="fine">Your password goes straight to Mill and isn't saved. This device keeps you signed in until you sign out.</p>
</form></template>

<template id="t-house"><section class="card house">
 <div class="row"><div><div class="name"></div><div class="sub status"></div></div><span class="pill"></span></div>
 <form class="go" hidden><label>Away until<input type="datetime-local" required></label>
  <div class="fine">Every room drops to its own Away temperature until then, then the schedule resumes.</div>
  <div class="row"><button type="button" class="cancel">Cancel</button><button class="primary">Start away mode</button></div></form>
 <button class="toggle"></button>
</section></template>

<template id="t-room"><section class="card">
 <div class="row"><div><div class="name"></div><div class="sub mode"></div></div><div class="now"><span class="amb"></span><small> °C</small></div></div>
 <div class="seg" role="group" aria-label="Room mode">
  <button data-m="schedule">Auto</button><button data-m="comfort">Comfort</button><button data-m="sleep">Sleep</button><button data-m="away">Away</button><button data-m="off">Off</button></div>
 <div class="presets"></div>
 <div class="heaters"></div>
</section></template>

<template id="t-preset"><div class="preset"><div class="sub"></div><b></b><div class="step"><button aria-label="Lower">−</button><button aria-label="Raise">+</button></div></div></template>

<template id="t-heater"><div class="heater"><div class="row">
 <div><div class="hn"></div><div class="sub seen"></div></div>
 <div class="row" style="gap:8px"><span class="pill"></span><button class="switch"></button></div></div>
 <div class="diag" hidden></div></div></template>

<template id="t-loose"><section class="card">
 <div class="row"><div><div class="name"></div><div class="sub where"></div></div><span class="pill"></span></div>
 <div class="row" style="margin-top:14px"><div class="now"><span class="amb"></span><small> °C now</small></div>
  <div class="set"><button data-d="-0.5" aria-label="Lower target">−</button><b></b><button data-d="0.5" aria-label="Raise target">+</button></div></div>
 <div class="row" style="margin-top:12px"><span class="sub seen"></span><button class="switch"></button></div>
 <div class="diag" hidden></div></section></template>

<script>
// ponytail: API override only via localStorage (local testing), never via URL, so a link can't redirect your login elsewhere
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const API=store.get('millApi')||'https://api.millnorwaycloud.com/';
const app=document.getElementById('app'),$=(el,s)=>el.querySelector(s);
const fmt=t=>t==null?'–':(Math.round(t*10)/10).toFixed(1);
const cap=s=>s?s[0].toUpperCase()+s.slice(1):'';
const ago=ms=>{if(!ms)return'never';const m=Math.round((Date.now()-ms)/60000);return m<2?'just now':m<120?m+' min ago':m<2880?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
const when=s=>new Date(s*1000).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const tpl=id=>document.getElementById(id).content.firstElementChild.cloneNode(true);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
function show(...n){app.className='';app.replaceChildren(...n)}
function note(text,cls){show(el('p','msg '+(cls||''),text))}
function chrome(on){document.getElementById('refresh').hidden=document.getElementById('logout').hidden=!on}
let toastT;function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>x.classList.remove('show'),3500)}

// ---- Mill API ----
class AuthError extends Error{}
async function raw(method,path,body,token){
 const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body&&JSON.stringify(body)});
 const t=await r.text();if(r.status===401)throw new AuthError('401');
 if(!r.ok){if(r.status===429)throw new Error('Mill is rate-limiting, wait a minute.');if(t.includes('Incorrect login'))throw new Error('Wrong email or password.');
  let why='';try{const j=JSON.parse(t);why=j.error?.message||j.message||j.error||j.errorCode||''}catch(e){why=t.slice(0,200)}
  throw new Error('Mill said '+r.status+(why?': '+(typeof why==='string'?why:JSON.stringify(why)):''))}
 try{return t?JSON.parse(t):{}}catch(e){if(t.includes('Incorrect login'))throw new Error('Wrong email or password.');return{}}}
function saveTokens(d){if(!d.idToken||!d.refreshToken)throw new Error('Sign-in failed.');store.set('idToken',d.idToken);store.set('refreshToken',d.refreshToken)}
async function mill(method,path,body){
 try{return await raw(method,path,body,store.get('idToken'))}
 catch(e){if(!(e instanceof AuthError))throw e;
  try{saveTokens(await raw('POST','customer/auth/refresh',null,store.get('refreshToken')))}catch(_){signOut('Signed out, please sign in again.');throw 0}
  return raw(method,path,body,store.get('idToken'))}}

function heater(d){const m=d.lastMetrics||{},des=(d.deviceSettings||{}).desired||{},dt=d.deviceType||{};
 return{id:d.deviceId,name:d.customName||(dt.childType||{}).name||d.deviceId,model:(dt.childType||{}).name||'',type:(dt.parentType||{}).name||'Heaters',
  online:!!d.isConnected,ambient:m.temperatureAmbient,target:m.temperature??des.temperature_normal,
  on:'isEnabled' in d?!!d.isEnabled:(m.powerStatus||0)>0,  // isEnabled is the source of truth; powerStatus can be stale
  heating:(m.heaterFlag||0)>0,power:m.currentPower,seen:m.time}}

async function fetchAll(){
 const hs=await mill('GET','houses'),out=[];
 for(const h of [...(hs.ownHouses||[]),...(hs.sharedHouses||[])]){
  const house={id:h.id,name:h.name||'Home',vac:!!h.isVacationModeActive,vacEnd:h.vacationEndDate,rooms:[],loose:[]};
  for(const r of (await mill('GET',`houses/${h.id}/devices`))||[]){
   if(!r.roomId)continue;
   const info=await mill('GET',`rooms/${r.roomId}/devices`);
   house.rooms.push({id:r.roomId,name:info.name||r.roomName||'Room',avg:info.averageTemperature,mode:info.mode,progMode:info.activeModeFromWeeklyProgram,
    override:info.overrideModeType,overrideEnd:info.overrideEndDate,program:info.roomProgramName,
    comfort:info.roomComfortTemperature,sleep:info.roomSleepTemperature,away:info.roomAwayTemperature,
    heaters:(r.devices||[]).filter(d=>d.deviceId).map(heater)})}
  for(const d of (await mill('GET',`houses/${h.id}/devices/independent`)).items||[])if(d.deviceId)house.loose.push(heater(d));
  out.push(house)}
 return out}

// on/off without touching the heater's mode (sending a mode here is what caused the 409)
const setPower=(h,on)=>mill('PATCH',`devices/${h.id}/settings`,{deviceType:h.type,enabled:on,settings:{}});
const setLooseTemp=(h,t)=>mill('PATCH',`devices/${h.id}/settings`,{deviceType:h.type,enabled:true,settings:{operation_mode:'independent_device',temperature_normal:t,temperature_in_independent_mode:t}});
const setRoomMode=(r,m)=>m==='schedule'?mill('DELETE',`rooms/${r.id}/mode/override`):mill('POST',`rooms/${r.id}/mode/override`,{mode:m,overrideModeType:'continuous'});
const setPresets=r=>mill('POST',`rooms/${r.id}/temperature`,{roomComfortTemperature:r.comfort,roomSleepTemperature:r.sleep,roomAwayTemperature:r.away});
const startAway=(h,end)=>mill('POST',`houses/${h.id}/mode/vacation`,{startDate:Math.floor(Date.now()/1000),endDate:end,vacationTemperature:10,vacationModeType:'use_away_temperature',isVacationModeActive:true});
const endAway=h=>mill('DELETE',`houses/${h.id}/mode/vacation`);

// ---- UI ----
async function act(fn,msg){try{await fn();if(msg)toast(msg);setTimeout(load,1500)}catch(e){if(e)toast(e.message)}}

function houseCard(h){const c=tpl('t-house');$(c,'.name').textContent=h.name;
 const pill=$(c,'.pill'),go=$(c,'.go'),btn=$(c,'.toggle');
 if(h.vac){c.classList.add('away');pill.textContent='Away';pill.classList.add('away');
  $(c,'.status').textContent=h.vacEnd?'Until '+when(h.vacEnd):'Away mode on';
  btn.textContent="We're home";btn.classList.add('primary');btn.onclick=()=>act(()=>endAway(h),'Welcome home, schedules resumed')}
 else{pill.textContent='Home';pill.classList.add('on');$(c,'.status').textContent='Heating follows each room below';
  btn.textContent="We're going away";btn.onclick=()=>{go.hidden=false;btn.hidden=true;
   const d=new Date(Date.now()+3*864e5);d.setMinutes(0,0,0);const inp=$(go,'input');
   const local=x=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,16);inp.value=local(d);inp.min=local(new Date())};
  $(go,'.cancel').onclick=()=>{go.hidden=true;btn.hidden=false};
  go.onsubmit=e=>{e.preventDefault();const end=Math.floor(new Date($(go,'input').value).getTime()/1000);
   if(!(end>Date.now()/1000))return toast('Pick a time in the future');act(()=>startAway(h,end),'Away mode on')}}
 return c}

function roomMode(r){
 if(r.override&&r.mode)return cap(r.mode)+' (manual'+(r.overrideEnd&&r.override==='not_continuous'?' until '+when(r.overrideEnd):'')+')';
 if(r.mode==='off')return'Off';
 if(r.mode==='vacation')return'Away mode (house)';
 return'Auto'+(r.program?' · '+r.program:'')+(r.progMode?' · '+cap(r.progMode)+' now':'')}

function heaterRow(h,inRoom){const row=tpl('t-heater');$(row,'.hn').textContent=h.name;
 $(row,'.seen').textContent=[h.online&&h.ambient!=null?fmt(h.ambient)+' °C':'',h.power?Math.round(h.power)+' W':'','seen '+ago(h.seen)].filter(Boolean).join(' · ');
 fillState(row,h);return row}
function fillState(c,h){const pill=$(c,'.pill');
 pill.textContent=!h.online?'Offline':!h.on?'Off':h.heating?'Heating':'Idle';pill.classList.add(!h.online?'offline':h.on&&h.heating?'on':'x');
 const sw=$(c,'.switch');sw.textContent=h.on?'On':'Off';sw.classList.toggle('on',h.on);sw.setAttribute('aria-label',h.name+' power');
 sw.onclick=()=>act(()=>setPower(h,!h.on),h.name+(h.on?' off':' on'));
 if(!h.online){const g=$(c,'.diag');g.hidden=false;g.textContent="Not reaching Mill's cloud (last report "+ago(h.seen)+"). Check it's on 2.4 GHz Wi-Fi with a decent signal.";sw.disabled=true}}

function roomCard(r){const c=tpl('t-room');$(c,'.name').textContent=r.name;$(c,'.mode').textContent=roomMode(r);$(c,'.amb').textContent=fmt(r.avg);
 if(r.heaters.some(h=>h.online&&h.on&&h.heating))c.classList.add('heating');
 const cur=r.override?r.mode:r.mode==='off'?'off':'schedule';
 c.querySelectorAll('.seg button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.m===cur);
  b.onclick=()=>{if(b.dataset.m!==cur)act(()=>setRoomMode(r,b.dataset.m),r.name+': '+(b.dataset.m==='schedule'?'back on schedule':cap(b.dataset.m)))}});
 const active=r.mode==='vacation'?'away':r.override?r.mode:r.progMode;let timer;
 for(const k of ['comfort','sleep','away']){const p=tpl('t-preset');$(p,'.sub').textContent=cap(k);const b=$(p,'b');b.textContent=fmt(r[k])+'°';
  if(k===active&&r.mode!=='off')p.classList.add('active');
  const [dn,up]=p.querySelectorAll('button');
  [[dn,-.5],[up,.5]].forEach(([btn,d])=>btn.onclick=()=>{r[k]=Math.min(35,Math.max(5,(r[k]??20)+d));b.textContent=fmt(r[k])+'°';
   clearTimeout(timer);timer=setTimeout(()=>act(()=>setPresets(r),r.name+' temperatures saved'),900)});
  $(c,'.presets').append(p)}
 const list=$(c,'.heaters');r.heaters.forEach(h=>list.append(heaterRow(h)));if(!r.heaters.length)list.remove();
 return c}

function looseCard(h){const c=tpl('t-loose');$(c,'.name').textContent=h.name;$(c,'.where').textContent=['Not in a room',h.model].filter(Boolean).join(' · ');
 if(h.online&&h.on&&h.heating)c.classList.add('heating');
 $(c,'.amb').textContent=fmt(h.ambient);$(c,'.seen').textContent=(h.power?Math.round(h.power)+' W · ':'')+'seen '+ago(h.seen);fillState(c,h);
 let t=h.target??20,timer;const b=$(c,'.set b');b.textContent=fmt(h.target)+'°';
 c.querySelectorAll('.set button').forEach(x=>{x.disabled=!h.online;x.onclick=()=>{t=Math.min(35,Math.max(5,t+ +x.dataset.d));b.textContent=fmt(t)+'°';
  clearTimeout(timer);timer=setTimeout(()=>act(()=>setLooseTemp(h,t),h.name+' set to '+fmt(t)+'°'),700)}});
 return c}

let busy=false;
async function load(){if(!store.get('refreshToken'))return login();if(busy)return;busy=true;chrome(true);
 try{const houses=await fetchAll(),nodes=[];
  for(const h of houses){nodes.push(houseCard(h));
   if(h.rooms.length){nodes.push(el('h2',null,'Rooms'));h.rooms.forEach(r=>nodes.push(roomCard(r)))}
   if(h.loose.length){nodes.push(el('h2',null,'Other heaters'));h.loose.forEach(x=>nodes.push(looseCard(x)))}}
  nodes.length?show(...nodes):note('No homes on this Mill account.')}
 catch(e){if(e)note(e.message,'err')}finally{busy=false}}

function signOut(msg){store.set('idToken',null);store.set('refreshToken',null);login(msg)}
function login(msg){chrome(false);const f=tpl('t-login');$(f,'.err').textContent=msg||'';show(f);
 f.onsubmit=async e=>{e.preventDefault();const b=$(f,'button');b.disabled=true;$(f,'.err').textContent='';
  try{saveTokens(await raw('POST','customer/auth/sign-in',{login:$(f,'#e').value.trim(),password:$(f,'#p').value}));load()}
  catch(err){$(f,'.err').textContent=err instanceof AuthError?'Wrong email or password.':err.message;b.disabled=false}}}

document.getElementById('refresh').onclick=load;
document.getElementById('logout').onclick=()=>signOut();
// ponytail: 60 s poll per open tab; Mill rate-limits, don't go lower. Skipped while a form is open.
setInterval(()=>{if(!document.hidden&&store.get('refreshToken')&&!app.querySelector('form:not([hidden])'))load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&store.get('refreshToken'))load()});
load();
</script></body></html>
